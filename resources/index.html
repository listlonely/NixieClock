<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>辉光时钟 NixieClock</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="mode-nixie">

  <!-- 赛博模式背景：数字雨 -->
  <canvas id="rain"></canvas>

  <!-- 赛博模式背景：透视网格地板 -->
  <div id="floor"><div class="floor-grid"></div></div>

  <div id="stage">

    <!-- 辉光管 / 赛博 共用的七段数码视图 -->
    <div class="flicker" id="segFlicker">
      <div class="seg-view view" id="segView">
        <div class="seg-row" id="segRow"></div>
        <div class="seg-date" id="segDate"></div>
      </div>
    </div>

    <!-- 翻页钟视图 -->
    <div class="flip-view view" id="flipView">
      <div class="flip-row">
        <div class="flip-group" id="flipHour"></div>
        <div class="flip-colon" id="flipColon"><i></i><i></i></div>
        <div class="flip-group" id="flipMin"></div>
        <div class="flip-spacer"></div>
        <div class="flip-group small" id="flipSec"></div>
      </div>
      <div class="flip-date" id="flipDate"></div>
    </div>

  </div>

  <!-- CRT 质感遮罩（辉光管模式） -->
  <div class="crt-overlay"></div>

  <!-- 控制条 -->
  <div id="controls">
    <div class="ctl-group">
      <button class="ctl mode-btn on" data-mode="nixie">辉光管</button>
      <button class="ctl mode-btn" data-mode="flip">翻页</button>
      <button class="ctl mode-btn" data-mode="cyber">赛博</button>
    </div>
    <div class="ctl-sep"></div>
    <div class="ctl-group">
      <button class="ctl" id="btnTop">置顶</button>
      <button class="ctl" id="btnFull">全屏</button>
      <button class="ctl" id="btnUpdate">更新</button>
      <button class="ctl warn" id="btnExit">退出</button>
    </div>
  </div>

  <div id="toast"></div>

  <script src="/js/neutralino.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
